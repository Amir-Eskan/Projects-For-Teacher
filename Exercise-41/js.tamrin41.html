<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body{
             background:
        radial-gradient(circle at 50% 120%, #4f46e5 0%, transparent 35%),
        radial-gradient(circle at 0% 0%, #312e81 0%, transparent 30%),
        linear-gradient(160deg, #020617, #0b1120 60%, #111827);

        }
        .kool{
            width: 1200px;
            margin:100px auto;

                display: flex;
                align-items: center;
                justify-content: space-around;
                flex-wrap: wrap;
            >.div{
                width: 300px;
                height: 440px;
                 box-shadow:
    0 0 15px rgba(255, 255, 255, 0.4),
    0 0 35px rgba(255, 255, 255, 0.2);
border-radius: 5px;
    >h3{
        color: white;
        text-align: center;
    }
                >img{
                    width: 100%;
                    object-fit: cover;
                    border-radius: 5px;
                }
            }
        }
        .buttons{

         display: flex;
         justify-content: center;
         align-content: center;
         gap: 20px;
  >button{
    padding: 10px 40px;
    background-color: black;
    color: white;
border-radius: 8px;
font-size: 20px;
transition:  ease 1s;
  }
        }
        .buttons button:hover{
            background-color: white;
            color: black;
            font-size: 22px;
        }
    </style>
</head>
<body>
    <div class="buttons">
        <button data-bot="all">همه</button>
        <button data-bot="phone">گوشی</button>
        <button data-bot="laptop">لپتاپ</button>
        <button data-bot="accessory">لوازم جانبی</button>
    </div>
    <div class="kool" data-bot="all">
        <div class="div" data-bot="phone">
            <img src="../img3/image.png" alt="">
            <h3>iphone 17 Max</h3>
            
        </div>
        <div class="div" data-bot="laptop">
            <img src="../img3/image copy.png" alt="">
            <h3>MacBook M5</h3>
        </div>
        <div class="div" data-bot="accessory">
            <img src="../img3/Fw8tUdWRExcdJfW_u2eJfPabTVzRQ9AW5MUDhkWGIJvSUZQpUAOK3gJ09o-uwz-G-PtFyGGfL8nCk5kk8Cu_Bh_KlIItlINT-mQ5lKkKfC82PxLnpFDnGbrSZNtPcBor9En3U29rRn3LVRaXhuRb6iR_dHugTlt_q2I2Q_d06WQ.jpg" alt="">
            <h3>AirPod 4 ANC</h3>
         
        </div>

    </div>
</body>
<script>
const button = document.querySelectorAll('button');
const div = document.querySelectorAll('.div');
button.forEach((val)=>{
    val.addEventListener('click',()=>{
        let bot=val.getAttribute('data-bot')
        div.forEach((item)=>{
let del=item.getAttribute('data-bot')
if(bot=='all'){
    item.style.display='block'
}else if(bot==del){
    item.style.display='block'
}else{
    item.style.display='none'
}
        })
    })
})

</script>
</html>
