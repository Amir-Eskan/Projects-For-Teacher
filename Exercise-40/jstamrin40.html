<script>

function myclick(s){
let det=s.getAttribute('data-click')
let more=s.previousElementSibling
if(det=='off'){
    s.setAttribute('data-click','on')
    more.style.display='block'
      s.innerText='بستن'
      s.style.backgroundColor='black'
}else{
  s.setAttribute('data-click','off')   
    more.style.display='none'
  s.innerText='اطلاعات بیشتر'
  s.style.backgroundColor='darkmagenta'

}




}
















const ul=document.getElementById('ul')
    function mybot(s,text){
let bot=s.getAttribute('data-eskan')
if(bot=='off'){

s.setAttribute('data-eskan','on')

let li=document.createElement('li')
let img=document.createElement('img')
img.src=s.parentElement.children[0].src
li.innerHTML=`

<h3>${text}</h3>

<p>${s.parentElement.children[2].innerText}</p>
<p>${s.getAttribute('data-cont')}</p>
<p onclick="del(this)">x</p>

`
li.prepend(img)
ul.append(li)

}else{
let cont=s.getAttribute('data-cont')
cont++
s.setAttribute('data-cont',cont)
let myli=document.querySelectorAll('ul>li')
for(let i=0;i<myli.length;i++){
if(myli[i].children[1].innerText==text){

    myli[i].children[3].innerText=s.getAttribute('data-cont')
}}
}


    }



  






  function del(s){
if(confirm('آیا این محصولو از سبد خرید میخواهید حذف کنید')){
s.setAttribute('data-eskan','off')
s.parentElement.remove()
}
       }

</script>
